name: Browser verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Chromium, Firefox and WebKit smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/work/browser-smoke/binaries
      RSC_SMOKE_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Select constrained verification policy
        env:
          RSC_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/ci-verification-policy.mjs
      - run: npm ci
      - name: Install isolated pinned browser driver
        run: node scripts/verify-browser-smoke.mjs --install-driver-only
      - name: Install all three engines and Linux dependencies
        run: |
          set -o pipefail
          node work/browser-smoke/driver/node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit 2>&1 | tee work/browser-smoke/installation.log
      - name: Build and select one local archive (publication blocked)
        if: env.RSC_VERIFICATION_POLICY == 'release-candidate'
        run: |
          node scripts/prepare-verification-artifact.mjs --policy "$RSC_VERIFICATION_POLICY" --expected-name "$RSC_EXPECTED_NAME" --expected-version "$RSC_EXPECTED_VERSION"
      - name: Verify genuine installed archive in all engines
        run: |
          set -o pipefail
          if [ "$RSC_VERIFICATION_POLICY" = release-candidate ]; then
            node scripts/verify-prepared-artifact.mjs browsers 2>&1 | tee work/browser-smoke/verification.log
          else
            npm run verify:browsers 2>&1 | tee work/browser-smoke/verification.log
          fi
      - name: Report and enforce complete browser evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          const currentPath = 'work/browser-smoke/current.json';
          if (!existsSync(currentPath)) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Browser smoke report unavailable: Chromium, Firefox and WebKit are not verified. Inspect installation and job logs.\n');
            process.exit(1);
          }
          const current = JSON.parse(readFileSync(currentPath, 'utf8'));
          const report = JSON.parse(readFileSync(`${current.directory}/results.json`, 'utf8'));
          assert.equal(current.runId, report.runId);
          const lines = ['| Engine | Executed version | Status | Checks | Axe violations |', '| --- | --- | --- | ---: | ---: |'];
          for (const name of ['chromium', 'firefox', 'webkit']) {
            const result = report.browsers.find(item => item.engine === name);
            lines.push(`| ${name} | ${result?.version ?? 'not executed'} | ${result?.status ?? 'not executed'} | ${result?.checks.length ?? 0} | ${result?.axeViolations ?? 'not executed'} |`);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Run ${report.runId}: ${report.status}; failing phase: ${report.failingPhase ?? 'none'}.\n`);
          assert.equal(report.name, 'browser-smoke');
          assert.equal(report.status, 'passed');
          assert.deepEqual(report.browsers.map(item => item.engine), ['chromium', 'firefox', 'webkit']);
          for (const result of report.browsers) {
            assert.equal(result.status, 'pass', result.engine);
            assert.equal(result.checks.length, 15, result.engine);
            assert.equal(result.axeViolations, 0, result.engine);
          }
          NODE
      - name: Upload browser evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            work/candidate/current.json
            work/candidate/run-*/identity.json
            work/browser-smoke/current.json
            work/browser-smoke/runs/
            work/browser-smoke/*.log
            work/browser-smoke/driver/package.json
            work/browser-smoke/driver/package-lock.json
            !work/**/*.tgz
            !work/**/*.tar.gz
