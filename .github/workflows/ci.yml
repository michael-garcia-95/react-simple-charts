name: CI
on:
  push:
    branches:
      [main, feat/m06-t06b3-release-candidate, feat/m06-t10a-docs-patch-0.1.1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        react: ['18.2.0', '19']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Select constrained verification policy
        env:
          RSC_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RSC_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          RSC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-verification-policy.mjs
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ startsWith(matrix.react, '18') && '18' || '19' }} @types/react-dom@${{ startsWith(matrix.react, '18') && '18' || '19' }}
      - name: Report resolved compatibility versions
        run: |
          node --version
          npm --version
          node -e 'for (const name of ["react", "react-dom", "@types/react", "@types/react-dom"]) console.log(name + "@" + require("./node_modules/" + name + "/package.json").version)'
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: node --test scripts/tests/npm-command.test.mjs
      - run: node --test scripts/tests/verification-server.test.mjs
      - run: node --test scripts/tests/verification-command.test.mjs scripts/tests/browser-driver.test.mjs scripts/tests/verification-evidence.test.mjs scripts/tests/consumer-verification.test.mjs scripts/tests/exact-artifact.test.mjs scripts/tests/manifest-policy.test.mjs scripts/tests/candidate-preparation.test.mjs scripts/tests/browser-preparation.test.mjs
      - run: node scripts/release-readiness.mjs --policy "$RSC_VERIFICATION_POLICY" --expected-name "$RSC_EXPECTED_NAME" --expected-version "$RSC_EXPECTED_VERSION"
      - run: npm run verify:package
        if: env.RSC_VERIFICATION_POLICY == 'development'
      - name: Build and select one local archive (publication blocked)
        if: env.RSC_VERIFICATION_POLICY == 'release-candidate'
        run: |
          node scripts/prepare-verification-artifact.mjs --policy "$RSC_VERIFICATION_POLICY" --expected-name "$RSC_EXPECTED_NAME" --expected-version "$RSC_EXPECTED_VERSION"
      - run: node scripts/verify-prepared-artifact.mjs package
        if: env.RSC_VERIFICATION_POLICY == 'release-candidate'
      - run: npm run verify:site:snippets
      - run: npm run build:site
      - run: node scripts/verify-site-build.mjs /
      - run: npm run build:site:pages
      - run: node scripts/verify-site-build.mjs /react-simple-charts/
      - run: npm run build:playground
      - run: npm pack --dry-run --ignore-scripts
