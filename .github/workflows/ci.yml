name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        react: ['18.2.0', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ startsWith(matrix.react, '18') && '18' || '19' }} @types/react-dom@${{ startsWith(matrix.react, '18') && '18' || '19' }}
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run verify:package
      - run: npm run build:playground
      - run: npm pack --dry-run
