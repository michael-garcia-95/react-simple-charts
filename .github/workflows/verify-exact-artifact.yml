name: Exact artifact verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/work/browser-smoke/binaries
      RSC_SMOKE_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Select constrained verification policy
        env:
          RSC_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/ci-verification-policy.mjs
      - run: npm ci
      - name: Prepare isolated drivers and all engines
        run: |
          node scripts/browser-driver.mjs --install
          node scripts/browser-driver.mjs --install --smoke
          node work/browser-smoke/driver/node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - name: Build and select one local archive (publication blocked)
        run: |
          node scripts/prepare-verification-artifact.mjs --policy "$RSC_VERIFICATION_POLICY" --expected-name "$RSC_EXPECTED_NAME" --expected-version "$RSC_EXPECTED_VERSION"
      - name: Verify that single archive through all genuine gates
        run: |
          set -o pipefail
          node scripts/verify-prepared-artifact.mjs all 2>&1 | tee work/exact-verification.log
      - name: Summarize finalized exact evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, appendFileSync} from 'node:fs';
          const pointer = JSON.parse(readFileSync('work/exact-artifact/current.json', 'utf8'));
          const report = JSON.parse(readFileSync(`${pointer.directory}/results.json`, 'utf8'));
          assert.equal(pointer.runId, report.runId);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Exact run ${report.runId}: ${report.status}\nArchive SHA-256: ${report.artifact?.sha256 ?? 'not selected'}\nSource: ${report.artifact?.source.checkoutSha ?? 'not established'}\n`);
          assert.equal(report.status, 'passed');
          const {identity} = JSON.parse(readFileSync('work/candidate/current.json', 'utf8'));
          assert.equal(report.artifact.sha256, identity.sha256);
          assert.deepEqual(report.policy, identity.policy);
          assert.equal(report.artifact.source.checkoutSha, identity.source.checkoutSha);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Policy: ${report.policy.name}; publication remains BLOCKED.\n`);
          assert.equal(report.package.status, 'passed');
          assert.deepEqual(report.gates.map(gate => [gate.name, gate.status]), [['installed-consumers', 'passed'], ['browser-smoke', 'passed']]);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-artifact-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            work/candidate/current.json
            work/candidate/run-*/identity.json
            work/exact-artifact/current.json
            work/exact-artifact/runs/
            work/exact-verification.log
            work/consumers/driver/package.json
            work/consumers/driver/package-lock.json
            work/browser-smoke/driver/package.json
            work/browser-smoke/driver/package-lock.json
            !work/**/*.tgz
            !work/**/*.tar.gz
